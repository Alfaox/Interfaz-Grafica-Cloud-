<div class="ranking">{% for fila in ranking %}<div class="rank-row"><span class="rank-number {% if forloop.first %}first{% endif %}">{{ forloop.counter|stringformat:'02d' }}</span><div><div class="rank-name">{{ fila.participacion__collera__nombre }}</div><div class="progress"><span style="width:{{ fila.porcentaje }}%"></span></div></div><div class="rank-total">{{ fila.kilos|floatformat:2 }} <small>kg</small></div></div>{% empty %}<div class="empty"><p>El ranking aparecerá al registrar los primeros kilos.</p></div>{% endfor %}</div>
