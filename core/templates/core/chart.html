{% load l10n %}<div class="chart" role="img" aria-label="Producción de los últimos siete días de la consulta. Valores detallados a continuación."><div class="plot">{% for dia in grafico %}<div class="bar-group"><div class="bars"><div class="bar current" style="height:{{ dia.altura|unlocalize }}%" title="{{ dia.fecha|date:'d/m' }}: {{ dia.kilos }} kg"></div></div><span class="bar-label">{{ dia.fecha|date:'d/m' }}</span></div>{% endfor %}</div></div><details class="chart-data"><summary>Consultar valores del gráfico</summary><div class="summary-list">{% for dia in grafico %}<div><span>{{ dia.fecha|date:'d/m/Y' }}</span><strong>{{ dia.kilos|floatformat:2 }} kg</strong></div>{% endfor %}</div></details>
