{% if jornadas %}<section class="panel filter-panel"><form method="get" class="toolbar"><div class="field"><label for="jornada">Jornada de trabajo</label><select name="jornada" id="jornada">{% for j in jornadas %}<option value="{{ j.pk }}" {% if jornada.pk == j.pk %}selected{% endif %}>{{ j }}</option>{% endfor %}</select></div><button class="btn" type="submit">Consultar</button></form></section>{% endif %}
