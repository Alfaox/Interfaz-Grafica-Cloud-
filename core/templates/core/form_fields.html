{% if form.non_field_errors %}<div class="form-error" role="alert">{{ form.non_field_errors }}</div>{% endif %}
<div class="form-grid">{% for f in form %}<div class="field {% if f.name == 'observaciones' or f.name == 'motivo' %}full{% endif %}"><label for="{{ f.id_for_label }}">{{ f.label }}{% if f.field.required %} <span class="muted" aria-hidden="true">*</span>{% endif %}</label>{{ f }}{% if f.help_text %}<small id="{{ f.auto_id }}_helptext">{{ f.help_text|safe }}</small>{% endif %}{% for e in f.errors %}<p class="form-error" role="alert">{{ e }}</p>{% endfor %}</div>{% endfor %}</div>
